[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pagarme-mcp"
version = "2.0.0"
description = "MCP Server para Pagar.me v5 + Shopify — financeiro, recebiveis, conciliacao, fluxo de caixa e antecipacoes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["pagarme", "mcp", "model-context-protocol", "financeiro", "shopify", "conciliacao"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<0.29.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
pagarme-mcp = "server:run"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
exclude = [
    "/.claude",
    "/.env",
    "/pagar.me",
    "/__pycache__",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
